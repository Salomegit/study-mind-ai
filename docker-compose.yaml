services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set this in the root .env file}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set this in the root .env file}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set this in the root .env file}
    restart: unless-stopped
    init: true

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATA_DIR: /data
      UPLOAD_DIR: /tmp/uploads
      MAX_FILE_SIZE_MB: 7
    volumes:
      - study-mind-data:/data
    restart: unless-stopped
    init: true
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers

  caddy:
    image: caddy:2-alpine
    env_file:
      - ./.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  study-mind-data:
  caddy-data:
  caddy-config:
